# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

timezone: Australia/Sydney
lang: en
title: Andrew Snape
email: andrew@andrewsnape.com.au
description: >- # this means to ignore newlines until "baseurl:"
  A coding blog about running a self-hosted homelab: NAS, Docker,
  the *arrs, Plex, Immich, File Flows, and Homebridge.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://andrew-snape.github.io" # the base hostname & protocol for your site, e.g. http://example.com
#twitter_username: jekyllrb

# Last.fm "now playing" widget on the Uses page (assets/lastfm.js).
# The API key is a public, read-only, non-secret credential -- it's meant
# to be embedded in client-side code like this. Never put the shared
# secret here; it's only needed for authenticated write calls (scrobbling)
# and this widget only ever reads.
lastfm_username: AndrewSnape
lastfm_api_key: 043779f46e2e4d44574daa2dc442b219
github_username:  andrew-snape

# Default social preview image (used for og:image / twitter:image on any
# page or post that doesn't set its own `image:` in its front matter).
# jekyll-seo-tag only reads `page.image`, not a site-level `image:` key,
# so this has to go through Jekyll's own front-matter defaults instead.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-card.png

# Clean, chronological URLs -- no stacked category segments, no .html.
permalink: /:year/:month/:day/:title/

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
