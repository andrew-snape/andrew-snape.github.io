# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow builds the Jekyll site to catch build errors on every push and PR.
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
    # Floating major-version tag (not a pinned SHA): the runner images this
    # action recognizes change over time, and an old pinned commit stops
    # matching current GitHub-hosted images (it starts misdetecting them as
    # self-hosted). See https://github.com/ruby/setup-ruby#versioning
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Build site
      run: bundle exec jekyll build
